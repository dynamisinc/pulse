name: Deploy Frontend

# Builds the Vite SPA and publishes it to the Static Web App (stapp-pulse-uat).
# Quality gates (lint + type-check + test) run pre-merge in ci.yml; this workflow
# assumes-green and only builds + deploys the already-gated main.

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "uat"
        type: choice
        options:
          - uat

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'uat' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: src/frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build
        run: npm run build
        working-directory: src/frontend
        env:
          # Optional. Blank → same-origin /api (see validateEnv.ts).
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
          # Opt-in mock data for a backend-less environment. Set the
          # VITE_USE_MOCK_DATA variable to 'true' on the target GitHub
          # Environment (uat) to render every surface from canned data. Unset →
          # fail closed (never mock). NEVER set 'true' on a participant-facing
          # production environment (COR-001). See core/config/mockData.ts.
          VITE_USE_MOCK_DATA: ${{ vars.VITE_USE_MOCK_DATA || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: src/frontend/dist
          retention-days: 1

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.environment || 'uat' }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: src/frontend/dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          skip_api_build: true
          app_location: "src/frontend/dist"
